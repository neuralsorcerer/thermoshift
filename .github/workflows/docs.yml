name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "benchmarks/README.md"
      - "notebooks/**"
      - "sample_dataset/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "benchmarks/README.md"
      - "notebooks/**"
      - "sample_dataset/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install -e ".[hub,analysis,notebook]"
          python -m pip check

      - name: Check generated column reference
        run: python scripts/update_schema.py --check

      # Use the current generator/runtime and keep tracked sample and notebook files intact.
      - name: Prepare isolated walkthrough
        shell: python
        run: |
          from pathlib import Path
          from shutil import copyfile

          Path("reports").mkdir(exist_ok=True)
          copyfile("notebooks/quickstart.ipynb", "reports/quickstart.ipynb")
          copyfile("notebooks/quickstart.ipynb", "reports/quickstart-sample.ipynb")

      - name: Execute bundled sample walkthrough
        run: python scripts/run_notebook.py reports/quickstart-sample.ipynb

      - name: Generate walkthrough data
        run: |
          python -m thermoshift init output/docs-smoke/sample_dataset --rows 50003 --seed 42
          python -m thermoshift generate output/docs-smoke/sample_dataset --quiet
          python -m thermoshift validate output/docs-smoke/sample_dataset

      - name: Execute walkthrough
        run: python scripts/run_notebook.py reports/quickstart.ipynb --cwd output/docs-smoke

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Sphinx documentation
        env:
          SPHINX_HTML_BASEURL: ${{ steps.pages.outputs.base_url }}
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Upload HTML preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          include-hidden-files: true

      - name: Upload walkthrough results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-walkthrough
          path: |
            reports/quickstart.ipynb
            reports/quickstart-sample.ipynb
            output/docs-smoke/sample_dataset/validation.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
